name: ci

on:
  push:
  pull_request:

jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run source-only tests
        run: python -m unittest discover -s tests/tools -p 'test_*.py' -v
      - name: Check repository contents
        run: python tools/check_source_only.py .

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
          - os: windows-latest
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_ROOT: ${{ runner.temp }}/vcpkg
      VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore vcpkg and install manifest dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
          vcpkgJsonGlob: vcpkg.json
      - name: Configure
        shell: bash
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET"
      - name: Build
        shell: bash
        run: cmake --build build/ci
      - name: Test
        shell: bash
        run: ctest --test-dir build/ci --output-on-failure
